[workspace]
authors = ["Brian Rogoff <brogoff@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "MojoDEC"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# NuMojo 0.12 is vendored in third_party/numojo, patched for Mojo 1.3
# (see third_party/README.md); every other task builds against it.
numojo = "mkdir -p build && mojo precompile third_party/numojo -o build/numojo.mojoc"
test = { cmd = "bash tests/run_all.sh", depends-on = ["numojo"] }
# `pixi run examples [NAME] [--show]`: see examples/README.md
examples = { cmd = "bash examples/run.sh", depends-on = ["numojo"] }
package = { cmd = "mojo precompile -I build mojodec -o build/mojodec.mojoc", depends-on = ["numojo"] }
format = "mojo format mojodec tests examples"
# `pixi run doc-check [--update | --list PATTERN]`: doc string warnings
# against docs/docstring-baseline.txt (see docs/writing-docs.md)
doc-check = { cmd = "python docs/check_docstrings.py", depends-on = ["numojo"] }
# API reference as Markdown in docs/api/, from `mojo doc`
docs = { cmd = "python docs/gen_api.py", depends-on = ["numojo"] }

[dependencies]
mojo = ">=1.3.0.dev0"
max-core = ">=26.8.0.dev0"
python = ">=3.12,<3.14"
numpy = ">=2.5.4,<3"
matplotlib = ">=3.11.2,<4"

[feature.docs.dependencies]
mkdocs-material = ">=9.8.0,<10"

# the API reference and docs/*.md as a site, in build/site
[feature.docs.tasks]
docs-site = { cmd = "mkdocs build --strict", depends-on = ["docs"] }
docs-serve = { cmd = "mkdocs serve", depends-on = ["docs"] }

[environments]
docs = { features = ["docs"], solve-group = "default" }
